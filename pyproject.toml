[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msi-mysticlight-controller-linux"
version = "1.0.0"
description = "MSI Mystic Light Controller for Linux — Keyboard backlight driver for MSI Gaming Laptops (Vector 16 HX AI, Crosshair, Pulse, Katana, Raider, etc.)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Anas Kummali", email = "anas@milkbun.in" }
]
keywords = [
    "msi",
    "mysticlight",
    "keyboard",
    "backlight",
    "rgb",
    "vector-16-hx",
    "gaming-laptop",
    "linux",
    "hidraw"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
msi-mysticlight = "msi_keyboard.cli:main"
msi-keyboard = "msi_keyboard.cli:main"
msi-rgb = "msi_keyboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
