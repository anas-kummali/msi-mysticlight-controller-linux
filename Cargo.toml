[package]
name = "msi-mysticlight"
version = "1.1.0"
edition = "2021"
authors = ["Anas Kummali <anas@milkbun.in>"]
description = "MSI Mystic Light Controller & GUI for Linux (24-Zone & 4-Zone Keyboards)"
license = "GPL-3.0"
readme = "README.md"

[lib]
name = "msi_mysticlight"
path = "src/lib.rs"

[[bin]]
name = "msi-mysticlight"
path = "src/main.rs"

[[bin]]
name = "msi-mysticlight-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
eframe = { version = "0.29.1", optional = true, default-features = false, features = ["default", "glow", "wayland", "x11"] }
